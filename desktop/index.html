    .sheet-backdrop{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;z-index:20}.sheet{width:100%;max-width:760px;margin:auto;background:#10162a;border:1px solid var(--line);border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow);max-height:82vh;overflow:auto}.sheet h2{margin:0 0 6px}.sheet p{margin:0 0 16px;color:var(--muted);font-size:13px}.field{width:100%;height:52px;border-radius:15px;background:#0a1020;border:1px solid #303c60;padding:0 15px;outline:0;margin:6px 0 12px}.field:focus{border-color:#8065ff}.sheet-actions{display:flex;gap:10px}.sheet-actions .btn{flex:1}.handle-preview{text-align:center;font-size:19px;font-weight:800;color:#bfb2ff;margin:12px}
    .stickers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.sticker{aspect-ratio:1;border-radius:18px;background:#171f36;border:1px solid var(--line);font-size:42px}.sticker:active{transform:scale(.88)}.story-viewer{position:fixed;inset:0;z-index:35;background:#03050bee;display:flex;align-items:center;justify-content:center;padding:18px}.story-card{position:relative;width:min(100%,430px);height:min(78vh,720px);border-radius:26px;overflow:hidden;background:linear-gradient(145deg,#263b96,#792db3);box-shadow:var(--shadow);display:flex;flex-direction:column}.story-media{width:100%;height:100%;object-fit:cover}.story-text{flex:1;display:grid;place-items:center;text-align:center;padding:42px;font-size:30px;font-weight:850;line-height:1.25}.story-info{position:absolute;left:16px;right:16px;top:16px;display:flex;align-items:center;gap:10px;text-shadow:0 2px 8px #000}.story-info .avatar{width:38px;height:38px}.story-close{margin-left:auto;width:38px;height:38px;border-radius:50%;background:#0007;color:white;font-size:21px}.story-caption{position:absolute;left:18px;right:18px;bottom:18px;padding:12px 14px;border-radius:14px;background:#0008;text-align:center}.story-nav{position:absolute;inset:68px 0 55px;display:flex}.story-nav button{width:50%;background:transparent}.story-progress{position:absolute;left:16px;right:16px;top:7px;display:flex;gap:4px}.story-progress i{height:3px;flex:1;border-radius:4px;background:#ffffff45}.story-progress i.done{background:white}.setting-action{height:36px;border-radius:12px;padding:0 12px;background:#2a3150;font-size:12px;font-weight:750}.status-row{display:flex;align-items:center;gap:13px;padding:14px 4px;border-bottom:1px solid #1c243b}.status-row .avatar{outline:2px solid var(--purple);outline-offset:3px}.status-row.mine .avatar{outline-color:var(--cyan)}.status-action{height:38px;padding:0 13px;border-radius:12px;background:#262f50;font-size:12px;font-weight:750}
    .onboarding{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 80% 10%,#5931a999,transparent 36%),#070b19;display:flex;align-items:center;justify-content:center;padding:24px}.onboard-card{width:100%;max-width:430px}.brand-icon{width:82px;height:82px;border-radius:27px;background:linear-gradient(135deg,#0abef5 0%,#1748ee 38%,#3c18ce 67%,#d528f3 100%);display:grid;place-items:center;color:#fff;font-size:45px;font-weight:900;letter-spacing:-6px;position:relative;box-shadow:0 20px 50px #5c3aff66}.brand-icon:after{content:"✦";position:absolute;right:14px;top:12px;font-size:15px;letter-spacing:0}.onboard-card h1{font-size:34px;letter-spacing:-1px;margin:18px 0 5px}.onboard-card>p{color:var(--muted);line-height:1.5;margin:0 0 22px}.small-note{font-size:11px!important;color:#747f9d!important;margin-top:12px!important}
    .call-overlay{position:fixed;inset:0;z-index:40;background:linear-gradient(180deg,#222944,#090c17);display:flex;flex-direction:column}.remote-video{width:100%;height:100%;object-fit:cover;background:#11172a}.call-audio-bg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 38%,#5e42b477,transparent 30%)}.call-audio-bg h2{font-size:28px;margin:18px 0 6px}.call-audio-bg p{color:#a9b2ca}.local-video{position:absolute;right:18px;top:calc(18px + env(safe-area-inset-top));width:112px;height:158px;border-radius:20px;object-fit:cover;background:#202842;border:2px solid #ffffff55;box-shadow:var(--shadow)}.call-status{position:absolute;left:20px;top:calc(24px + env(safe-area-inset-top));text-shadow:0 2px 9px #000}.call-status b{font-size:22px}.call-status small{display:block;margin-top:4px}.call-controls{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));left:16px;right:16px;display:flex;justify-content:center;gap:13px}.call-control{width:58px;height:58px;border-radius:50%;background:#293047dd;color:white;font-size:21px;backdrop-filter:blur(15px)}.call-control.off{background:#f4f5fb;color:#111}.call-control.hang{background:var(--red);font-size:26px}
    .incoming{position:fixed;inset:0;z-index:45;background:#070b19ee;display:flex;align-items:center;justify-content:center;padding:24px}.incoming-card{text-align:center;width:100%;max-width:360px}.incoming-card h2{font-size:29px;margin:18px 0 7px}.incoming-card p{color:var(--muted)}.incoming-actions{display:flex;justify-content:center;gap:36px;margin-top:35px}.round-action{width:70px;height:70px;border-radius:50%;font-size:27px}.round-action.accept{background:var(--green)}.round-action.decline{background:var(--red)}

    .tabs{display:flex;background:#11182b;border-radius:14px;padding:4px;margin:10px 0}.tab{flex:1;padding:10px 6px;border-radius:11px;background:transparent;color:var(--muted);font-size:12px}.tab.active{background:#2a3150;color:white}
    @media(min-width:600px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}.sheet{margin-bottom:18px;border-radius:26px}.sheet-backdrop{align-items:flex-end}.messages{padding-left:40px;padding-right:40px}}

<body>
  <div class="startup-splash" aria-label="Created by Arad649"><span>Created by Arad649</span></div>
  <div id="app">
    <header class="topbar" id="topbar"></header>
    <main id="content"></main>
    <button id="fab" class="fab hidden" aria-label="Add contact">＋</button>
    <nav class="bottom-nav" id="nav"></nav>
  </div>
  <div id="modal"></div>
  <div id="callRoot"></div>
  <div id="toastRoot"></div>
  <input id="imagePicker" type="file" accept="image/*" class="hidden" />
  <input id="storyPicker" type="file" accept="image/*" class="hidden" />

  <script>
  (()=>{
    'use strict';
    const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const now=()=>Date.now(), time=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
    const normalize=id=>String(id||'').trim().replace(/^@/,'').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,28);
    const deviceType=/Android/i.test(navigator.userAgent)?'mobile':'desktop';
    const peerKey=(id,type=deviceType)=>'settings-connect-'+normalize(id)+'-'+type;
    const fromPeerKey=id=>String(id).replace(/^settings-connect-/,'').replace(/-(mobile|desktop)$/,'');
    const store={
      get(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},
      set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{toast('Storage is full — remove large attachments');return false}}
    };
    let profile=store.get('profile',null), account=store.get('account',null), contacts=store.get('contacts',[]), chats=store.get('chats',{}), calls=store.get('calls',[]), stories=store.get('stories',[]);
    let tab='chats', activeChat=null, peer=null, online=false, authenticated=false, connections={}, mediaRecorder=null, recordStarted=0;
    let currentCall=null, incomingCall=null, localStream=null, remoteStream=null, callType='audio', callPeerId=null, callDirection='outgoing', callLogged=false;
    let pendingPackets={}, notificationEnabled=store.get('notificationEnabled',true), storyIndex=0, storyOwner=null, lockAtLaunch=store.get('lockAtLaunch',false);
    let transportQueues={}, incomingChunks={}, mediaDbPromise=null;
    const mediaPersisted=new Set(), MEDIA_DB='settings-connect-media', MEDIA_STORE='media', MEDIA_TYPES=new Set(['image','voice']);
    const stickers=['😎','🥳','😂','😍','🤯','😭','😡','🤝','🔥','💜','✨','👍','👀','🎉','🚀','✅','🐱','🐰','🦊','🐼'];

    function openMediaDb(){if(!('indexedDB'in window))return Promise.resolve(null);if(!mediaDbPromise)mediaDbPromise=new Promise((resolve,reject)=>{const request=indexedDB.open(MEDIA_DB,1);request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains(MEDIA_STORE))request.result.createObjectStore(MEDIA_STORE)};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)}).catch(()=>null);return mediaDbPromise}
    async function mediaWrite(key,value){const db=await openMediaDb();if(!db)return false;return new Promise(resolve=>{try{const tx=db.transaction(MEDIA_STORE,'readwrite');tx.objectStore(MEDIA_STORE).put(value,key);tx.oncomplete=()=>resolve(true);tx.onerror=()=>resolve(false);tx.onabort=()=>resolve(false)}catch{resolve(false)}})}
    async function mediaRead(key){const db=await openMediaDb();if(!db)return'';return new Promise(resolve=>{try{const request=db.transaction(MEDIA_STORE,'readonly').objectStore(MEDIA_STORE).get(key);request.onsuccess=()=>resolve(typeof request.result==='string'?request.result:'');request.onerror=()=>resolve('')}catch{resolve('')}})}
    async function mediaRemove(key){mediaPersisted.delete(key);const db=await openMediaDb();if(!db)return;try{db.transaction(MEDIA_STORE,'readwrite').objectStore(MEDIA_STORE).delete(key)}catch{}}
    async function clearMediaStorage(){const db=await openMediaDb();if(db){try{db.close()}catch{}}mediaDbPromise=null;mediaPersisted.clear();return new Promise(resolve=>{if(!('indexedDB'in window))return resolve();const request=indexedDB.deleteDatabase(MEDIA_DB);request.onsuccess=request.onerror=request.onblocked=()=>resolve()})}
    function persistMediaBodies(){if(!('indexedDB'in window))return;const queue=(key,value)=>{if(!value||mediaPersisted.has(key))return;mediaPersisted.add(key);mediaWrite(key,value).then(ok=>{if(!ok)mediaPersisted.delete(key)})};Object.values(chats).forEach(list=>list.forEach(m=>{if(MEDIA_TYPES.has(m.type)&&m.body)queue('message:'+m.id,m.body)}));stories.forEach(s=>{if(s.type==='image'&&s.body)queue('story:'+s.id,s.body)})}
    function compactChats(){if(!('indexedDB'in window))return chats;const result={};Object.entries(chats).forEach(([id,list])=>{result[id]=list.map(m=>MEDIA_TYPES.has(m.type)&&m.body?{...m,body:'',mediaStored:true}:m)});return result}
    function compactStories(){if(!('indexedDB'in window))return stories.slice(-40);return stories.slice(-40).map(s=>s.type==='image'&&s.body?{...s,body:'',mediaStored:true}:s)}
    async function hydrateMedia(){const jobs=[];Object.values(chats).forEach(list=>list.forEach(m=>{if(MEDIA_TYPES.has(m.type)&&m.mediaStored&&!m.body){const key='message:'+m.id;jobs.push(mediaRead(key).then(value=>{if(value){m.body=value;mediaPersisted.add(key)}}))}}));stories.forEach(s=>{if(s.type==='image'&&s.mediaStored&&!s.body){const key='story:'+s.id;jobs.push(mediaRead(key).then(value=>{if(value){s.body=value;mediaPersisted.add(key)}}))}});await Promise.all(jobs)}
    function save(){pruneStories();persistMediaBodies();store.set('contacts',contacts);store.set('chats',compactChats());store.set('calls',calls.slice(0,40));store.set('stories',compactStories())}

    function showIncoming(call,type){const id=callPeerId,c=contact(id)||{name:'@'+id};$('#callRoot').innerHTML=`<div class="incoming"><div class="incoming-card">${avatar(c.name,'lg')}<h2>${esc(c.name)}</h2><p>Incoming ${esc(type)} call • @${esc(id)}</p><div class="incoming-actions"><button class="round-action decline" id="declineCall">✕</button><button class="round-action accept" id="acceptCall">☎</button></div></div></div>`;$('#declineCall').onclick=()=>{call.close();incomingCall=null;$('#callRoot').innerHTML='';logCall(id,type,'incoming')};$('#acceptCall').onclick=()=>acceptCall(call,id,type)}
    async function acceptCall(call,id,type){try{callType=type;callPeerId=id;callDirection='incoming';callLogged=false;localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:type==='video'?{facingMode:'user'}:false});call.answer(localStream);currentCall=call;incomingCall=null;showCall(type,id,'Connecting…');attachCall(call,id,type,'incoming')}catch(e){call.close();$('#callRoot').innerHTML='';toast('Camera or microphone permission is required')}}
    function attachCall(call,id,type,direction){callDirection=direction;call.on('stream',stream=>{remoteStream=stream;const rv=$('#remoteVideo');if(rv){rv.srcObject=stream;rv.play().catch(()=>{})}const st=$('#callState');if(st)st.textContent='Connected • encrypted';const st2=$('#callState2');if(st2)st2.textContent='Connected • encrypted'});call.on('close',()=>{logCurrentCall();endCall(false)});call.on('error',()=>{logCurrentCall();endCall(false);toast('The call could not connect')})}
    function showCall(type,id,status){const c=contact(id)||{name:'@'+id};$('#callRoot').innerHTML=`<div class="call-overlay">${type==='video'?'<video id="remoteVideo" class="remote-video" autoplay playsinline></video>':`<div class="call-audio-bg">${avatar(c.name,'lg')}<h2>${esc(c.name)}</h2><p id="callState">${esc(status)}</p></div>`}<div class="call-status"><b>${esc(c.name)}</b><small id="callState2">${esc(status)}</small></div>${type==='video'?'<video id="localVideo" class="local-video" autoplay muted playsinline></video>':''}<div class="call-controls"><button class="call-control" id="muteCall" aria-label="Mute microphone">🎙</button>${type==='video'?'<button class="call-control" id="videoToggle" aria-label="Turn camera on or off">📹</button><button class="call-control" id="flipCamera" aria-label="Switch camera">↻</button>':''}<button class="call-control hang" id="hangCall" aria-label="End call">☎</button></div></div>`;if(type==='video'&&localStream){$('#localVideo').srcObject=localStream;$('#localVideo').play().catch(()=>{})}$('#muteCall').onclick=toggleMute;if($('#videoToggle'))$('#videoToggle').onclick=toggleVideo;if($('#flipCamera'))$('#flipCamera').onclick=flipCamera;$('#hangCall').onclick=()=>endCall(true)}
    function toggleMute(){const t=localStream?.getAudioTracks()[0];if(!t)return;t.enabled=!t.enabled;$('#muteCall').classList.toggle('off',!t.enabled)}
    function toggleVideo(){const t=localStream?.getVideoTracks()[0];if(!t)return;t.enabled=!t.enabled;$('#videoToggle').classList.toggle('off',!t.enabled)}
    async function flipCamera(){const t=localStream?.getVideoTracks()[0];if(!t)return;const current=t.getSettings().facingMode||'user';try{await t.applyConstraints({facingMode:current==='user'?{exact:'environment'}:'user'})}catch{toast('Camera switching is not supported on this device')}}
    function logCall(id,type,direction){const c=contact(id);calls.unshift({id,name:c?.name||'@'+id,type,direction,at:now()});calls=calls.slice(0,40);save()}
    function logCurrentCall(){if(!callLogged&&callPeerId){callLogged=true;logCall(callPeerId,callType,callDirection)}}
    function endCall(close=true){if(currentCall)logCurrentCall();if(close&&currentCall){try{currentCall.close()}catch{}}localStream?.getTracks().forEach(t=>t.stop());remoteStream?.getTracks().forEach(t=>t.stop());localStream=remoteStream=currentCall=null;$('#callRoot').innerHTML='';render()}

    function back(){if($('#modal').innerHTML){closeModal();return true}if(incomingCall){try{incomingCall.close()}catch{}incomingCall=null;$('#callRoot').innerHTML='';return true}if(currentCall){endCall(true);return true}if(activeChat){closeChat();return true}return false}
    function shutdown(){try{mediaRecorder?.stop()}catch{}try{currentCall?.close()}catch{}localStream?.getTracks().forEach(t=>t.stop());try{peer?.destroy()}catch{}}
    function refreshShell(){if(authenticated)render()}
    window.SettingsConnect={back,shutdown,refresh:refreshShell};
    async function boot(){if(account){profile=profile||{name:account.name,id:account.id};if(!lockAtLaunch&&sessionStorage.getItem('manualLock')!=='1')await startAuthenticatedSession();else showSignIn()}else if(profile)showOnboarding(true);else showOnboarding(false)}
    boot()
  })();
  </script>
</body>
</html>
