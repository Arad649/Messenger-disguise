<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#070b19" />
  <title>Settings Connect</title>
  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <style>
    :root{--bg:#070b19;--panel:#10162a;--panel2:#171e35;--line:#242d49;--text:#f7f8ff;--muted:#8c96b5;--purple:#6d4aff;--purple2:#9c37ff;--cyan:#18d7df;--green:#39d98a;--red:#ff4d5e;--shadow:0 22px 60px #0008}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,Roboto,system-ui,sans-serif}
    body{background:radial-gradient(circle at 95% -10%,#38207188,transparent 38%),var(--bg)}
    button,input{font:inherit;color:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}
    #app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:auto;position:relative;background:linear-gradient(180deg,#090e20,#070b19 55%);box-shadow:0 0 70px #0006}
    .topbar{padding:calc(16px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;gap:12px;min-height:76px;border-bottom:1px solid #20294380;background:#080d1de8;backdrop-filter:blur(20px);z-index:3}
    .topbar h1{font-size:24px;margin:0;letter-spacing:-.7px}.topbar .sub{font-size:12px;color:var(--muted);margin-top:2px}.grow{flex:1}.status-dot{width:9px;height:9px;border-radius:50%;background:#64708d;box-shadow:0 0 0 4px #64708d22}.status-dot.online{background:var(--green);box-shadow:0 0 12px #39d98a}
    .icon-btn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--panel2);font-size:20px;border:1px solid var(--line)}.icon-btn.primary{background:linear-gradient(135deg,var(--purple),var(--purple2));border:0}.icon-btn.danger{background:var(--red);border:0}
    #content{flex:1;overflow:auto;padding:0 16px 100px;scroll-behavior:smooth}.page-title{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1.2px;margin:20px 4px 10px}
    .search{margin:12px 0 8px;background:#131a2f;border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;padding:0 14px;height:48px;gap:10px;color:var(--muted)}.search input{background:transparent;border:0;outline:0;width:100%;font-size:15px}
    .stories{display:flex;gap:14px;overflow-x:auto;padding:12px 2px 16px}.story{min-width:62px;text-align:center;font-size:11px;color:#cbd0e3}.story .avatar{outline:2px solid var(--purple);outline-offset:3px;margin:auto auto 8px}
    .avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:white;background:linear-gradient(135deg,var(--purple),var(--cyan));position:relative;overflow:hidden}.avatar.sm{width:38px;height:38px}.avatar.lg{width:86px;height:86px;font-size:27px}.avatar .presence{position:absolute;width:12px;height:12px;border:2px solid var(--panel);background:var(--green);border-radius:50%;right:0;bottom:1px}
    .chat-row,.contact-row,.call-row{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid #1c243b}.chat-row:active,.contact-row:active{background:#ffffff06}.row-main{min-width:0;flex:1}.row-name{font-weight:750;display:flex;align-items:center;gap:6px}.row-preview{color:var(--muted);font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-time{font-size:11px;color:var(--muted)}.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--purple);display:grid;place-items:center;font-size:11px;font-weight:800;margin-top:8px}.pin{font-size:12px;color:var(--cyan)}
    .fab{position:absolute;right:20px;bottom:calc(82px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,#315bff,var(--purple2));color:#fff;font-size:28px;box-shadow:0 12px 30px #6848ff77;z-index:4}
    .bottom-nav{position:absolute;bottom:0;left:0;right:0;height:calc(72px + env(safe-area-inset-bottom));padding:7px 10px env(safe-area-inset-bottom);display:flex;background:#0a1021ee;border-top:1px solid var(--line);backdrop-filter:blur(20px);z-index:5}.nav-item{flex:1;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:650}.nav-item span{font-size:22px;line-height:22px}.nav-item.active{color:#a896ff}.nav-item.active span{filter:drop-shadow(0 0 8px #7658ff)}
    .empty{text-align:center;padding:70px 26px;color:var(--muted)}.empty .big{font-size:50px;margin-bottom:12px}.empty h3{color:var(--text);margin:0 0 8px}
    .hero-card{margin-top:16px;padding:20px;border-radius:22px;background:linear-gradient(135deg,#192142,#2a1854);border:1px solid #5947a466;position:relative;overflow:hidden}.hero-card:after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;background:#18d7df22;right:-35px;top:-40px}.hero-card h2{font-size:21px;margin:0 0 7px}.hero-card p{margin:0;color:#b7bfd8;font-size:14px;line-height:1.5}.id-chip{display:inline-flex;margin-top:14px;padding:8px 12px;border:1px solid #6d58c2;border-radius:12px;background:#0b102577;font-weight:700;color:#cfc7ff}
    .feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.feature{padding:16px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}.feature .emoji{font-size:24px}.feature b{display:block;margin:8px 0 4px}.feature small{color:var(--muted);line-height:1.35}
    .settings-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;margin:12px 0;overflow:hidden}.setting-row{padding:15px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.setting-row:last-child{border:0}.setting-icon{width:38px;height:38px;border-radius:12px;background:#242d50;display:grid;place-items:center}.warning{padding:14px;border:1px solid #5b4a2e;background:#2a2115;border-radius:16px;color:#e6cc94;font-size:12px;line-height:1.5}
    .btn{height:48px;padding:0 18px;border-radius:15px;background:linear-gradient(135deg,var(--purple),var(--purple2));font-weight:800}.btn.secondary{background:var(--panel2);border:1px solid var(--line)}.btn.danger{background:#401c29;color:#ff9eaa}.btn.wide{width:100%}.btn:disabled{opacity:.45}
    .chat-header{cursor:pointer}.chat-screen{height:100%;display:flex;flex-direction:column}.messages{flex:1;overflow-y:auto;padding:16px 14px 108px;background:radial-gradient(circle at 15% 10%,#493d9122,transparent 32%),linear-gradient(180deg,#080d1c,#090d19)}.encryption{text-align:center;color:#8691b0;background:#11192d;border:1px solid #202d4a;padding:10px 14px;border-radius:14px;font-size:11px;line-height:1.4;margin:0 auto 18px;max-width:350px}.msg-line{display:flex;margin:7px 0}.msg-line.mine{justify-content:flex-end}.bubble{max-width:82%;padding:10px 12px;border-radius:18px 18px 18px 5px;background:#1b2338;box-shadow:0 4px 13px #0003;word-break:break-word}.mine .bubble{border-radius:18px 18px 5px 18px;background:linear-gradient(135deg,#294fcf,#6436c8)}.bubble .meta{font-size:9px;color:#aab2cb;text-align:right;margin-top:4px}.bubble img{display:block;max-width:100%;border-radius:13px;margin-bottom:6px}.sticker-msg{font-size:54px;background:transparent!important;box-shadow:none;padding:2px 4px}.voice{display:flex;align-items:center;gap:10px;min-width:220px}.voice button{width:36px;height:36px;border-radius:50%;background:#fff;color:#4f43dd}.wave{height:24px;flex:1;background:repeating-linear-gradient(90deg,#cfd5ff 0 2px,transparent 2px 5px);clip-path:polygon(0 45%,5% 25%,10% 65%,15% 15%,20% 78%,25% 34%,30% 55%,35% 20%,40% 70%,45% 38%,50% 62%,55% 18%,60% 75%,65% 30%,70% 58%,75% 22%,80% 68%,85% 35%,90% 60%,95% 25%,100% 50%,100% 55%,0 55%);opacity:.8}.voice small{font-size:10px}
    .composer-wrap{position:absolute;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#0a1021f5;border-top:1px solid var(--line);z-index:4}.composer{display:flex;align-items:center;gap:8px}.compose-input{height:48px;flex:1;border-radius:17px;background:#151d32;border:1px solid var(--line);display:flex;align-items:center;padding:0 12px}.compose-input input{width:100%;background:transparent;border:0;outline:0}.mini-btn{width:43px;height:43px;min-width:43px;border-radius:15px;background:#1b2541;font-size:19px}.mini-btn.send{background:linear-gradient(135deg,var(--purple),var(--purple2))}.mini-btn.recording{background:var(--red);animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(.9);box-shadow:0 0 0 8px #ff4d5e22}}
    .sheet-backdrop{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;z-index:20}.sheet{width:100%;max-width:760px;margin:auto;background:#10162a;border:1px solid var(--line);border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow);max-height:82vh;overflow:auto}.sheet h2{margin:0 0 6px}.sheet p{margin:0 0 16px;color:var(--muted);font-size:13px}.field{width:100%;height:52px;border-radius:15px;background:#0a1020;border:1px solid #303c60;padding:0 15px;outline:0;margin:6px 0 12px}.field:focus{border-color:#8065ff}.sheet-actions{display:flex;gap:10px}.sheet-actions .btn{flex:1}.handle-preview{text-align:center;font-size:19px;font-weight:800;color:#bfb2ff;margin:12px}
    .stickers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.sticker{aspect-ratio:1;border-radius:18px;background:#171f36;border:1px solid var(--line);font-size:42px}.sticker:active{transform:scale(.88)}
    .onboarding{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 80% 10%,#5931a999,transparent 36%),#070b19;display:flex;align-items:center;justify-content:center;padding:24px}.onboard-card{width:100%;max-width:430px}.brand-icon{width:82px;height:82px;border-radius:27px;background:linear-gradient(135deg,#1c65ff,var(--purple2));display:grid;place-items:center;font-size:42px;box-shadow:0 20px 50px #5c3aff66}.onboard-card h1{font-size:34px;letter-spacing:-1px;margin:18px 0 5px}.onboard-card>p{color:var(--muted);line-height:1.5;margin:0 0 22px}.small-note{font-size:11px!important;color:#747f9d!important;margin-top:12px!important}
    .call-overlay{position:fixed;inset:0;z-index:40;background:linear-gradient(180deg,#222944,#090c17);display:flex;flex-direction:column}.remote-video{width:100%;height:100%;object-fit:cover;background:#11172a}.call-audio-bg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 38%,#5e42b477,transparent 30%)}.call-audio-bg h2{font-size:28px;margin:18px 0 6px}.call-audio-bg p{color:#a9b2ca}.local-video{position:absolute;right:18px;top:calc(18px + env(safe-area-inset-top));width:112px;height:158px;border-radius:20px;object-fit:cover;background:#202842;border:2px solid #ffffff55;box-shadow:var(--shadow)}.call-status{position:absolute;left:20px;top:calc(24px + env(safe-area-inset-top));text-shadow:0 2px 9px #000}.call-status b{font-size:22px}.call-status small{display:block;margin-top:4px}.call-controls{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));left:16px;right:16px;display:flex;justify-content:center;gap:13px}.call-control{width:58px;height:58px;border-radius:50%;background:#293047dd;color:white;font-size:21px;backdrop-filter:blur(15px)}.call-control.off{background:#f4f5fb;color:#111}.call-control.hang{background:var(--red);font-size:26px}
    .incoming{position:fixed;inset:0;z-index:45;background:#070b19ee;display:flex;align-items:center;justify-content:center;padding:24px}.incoming-card{text-align:center;width:100%;max-width:360px}.incoming-card h2{font-size:29px;margin:18px 0 7px}.incoming-card p{color:var(--muted)}.incoming-actions{display:flex;justify-content:center;gap:36px;margin-top:35px}.round-action{width:70px;height:70px;border-radius:50%;font-size:27px}.round-action.accept{background:var(--green)}.round-action.decline{background:var(--red)}
    .toast{position:fixed;z-index:90;left:50%;bottom:100px;transform:translateX(-50%);background:#edf0ff;color:#11172a;border-radius:14px;padding:11px 16px;font-size:13px;font-weight:700;box-shadow:var(--shadow);max-width:88%;text-align:center}
    .tabs{display:flex;background:#11182b;border-radius:14px;padding:4px;margin:10px 0}.tab{flex:1;padding:10px 6px;border-radius:11px;background:transparent;color:var(--muted);font-size:12px}.tab.active{background:#2a3150;color:white}
    @media(min-width:600px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}.sheet{margin-bottom:18px;border-radius:26px}.sheet-backdrop{align-items:flex-end}.messages{padding-left:40px;padding-right:40px}}
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar"></header>
    <main id="content"></main>
    <button id="fab" class="fab hidden" aria-label="Add contact">＋</button>
    <nav class="bottom-nav" id="nav"></nav>
  </div>
  <div id="modal"></div>
  <div id="callRoot"></div>
  <div id="toastRoot"></div>
  <input id="imagePicker" type="file" accept="image/*" class="hidden" />

  <script>
  (()=>{
    'use strict';
    const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const now=()=>Date.now(), time=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
    const normalize=id=>String(id||'').trim().replace(/^@/,'').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,28);
    const deviceType=/Android/i.test(navigator.userAgent)?'mobile':'desktop';
    const peerKey=(id,type=deviceType)=>'settings-connect-'+normalize(id)+'-'+type;
    const fromPeerKey=id=>String(id).replace(/^settings-connect-/,'').replace(/-(mobile|desktop)$/,'');
    const store={
      get(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},
      set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{toast('Storage is full — remove large attachments');return false}}
    };
    let profile=store.get('profile',null), account=store.get('account',null), contacts=store.get('contacts',[]), chats=store.get('chats',{}), calls=store.get('calls',[]);
    let tab='chats', activeChat=null, peer=null, online=false, authenticated=false, connections={}, mediaRecorder=null, recordStarted=0;
    let currentCall=null, incomingCall=null, localStream=null, remoteStream=null, callType='audio', callPeerId=null, callDirection='outgoing', callLogged=false;
    const stickers=['😎','🥳','😂','😍','🤯','😭','😡','🤝','🔥','💜','✨','👍','👀','🎉','🚀','✅','🐱','🐰','🦊','🐼'];

    function save(){store.set('contacts',contacts);store.set('chats',chats);store.set('calls',calls.slice(0,40))}
    function toast(text){const r=$('#toastRoot');r.innerHTML=`<div class="toast">${esc(text)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML='',2800);try{AndroidApp.toast(String(text))}catch{}}
    function avatar(name,size=''){return `<div class="avatar ${size}">${esc(initials(name))}</div>`}
    function contact(id){return contacts.find(c=>c.id===normalize(id))}
    function ensureContact(id,name){id=normalize(id);if(!id||id===profile?.id)return null;let c=contact(id);if(!c){c={id,name:name||'@'+id,last:'New contact',lastAt:now(),unread:0,online:false};contacts.unshift(c)}else if(name&&(!c.name||c.name.startsWith('@')))c.name=name;save();return c}
    function chatMessages(id){id=normalize(id);return chats[id]||(chats[id]=[])}
    function pushMessage(id,m){const list=chatMessages(id);list.push(m);if(list.length>80)list.splice(0,list.length-80);const c=ensureContact(id,m.senderName);if(c){c.last=m.type==='text'?m.body:m.type==='voice'?'🎙 Voice note':m.type==='image'?'📷 Photo':m.type==='sticker'?m.body:'Message';c.lastAt=m.at;c.online=true;if(activeChat!==id)c.unread=(c.unread||0)+1}contacts.sort((a,b)=>(b.lastAt||0)-(a.lastAt||0));save()}

    function render(){
      const nav=$('#nav'), top=$('#topbar'), fab=$('#fab');
      if(activeChat){nav.classList.add('hidden');fab.classList.add('hidden');renderChat();return}
      nav.classList.remove('hidden');fab.classList.toggle('hidden',tab!=='chats'&&tab!=='people');
      const titles={chats:'Settings Connect',calls:'Calls',people:'People',settings:'Settings'};
      const title=titles[tab];top.innerHTML=`<div class="grow"><h1>${title}</h1><div class="sub">@${esc(profile.id)} • ${deviceType==='mobile'?'Phone':'PC'} • ${online?'online':'offline'}</div></div><i class="status-dot ${online?'online':''}"></i>`;
      nav.innerHTML=[['chats','💬','Chats'],['calls','☎','Calls'],['people','◉','People'],['settings','⚙','Settings']].map(x=>`<button class="nav-item ${tab===x[0]?'active':''}" data-tab="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('');
      nav.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
      fab.onclick=openAdd;
      ({chats:renderChats,calls:renderCalls,people:renderPeople,settings:renderSettings}[tab])();
    }

    function renderChats(){
      const list=contacts.slice().sort((a,b)=>(b.lastAt||0)-(a.lastAt||0));
      $('#content').innerHTML=`<div class="search">⌕ <input id="searchInput" placeholder="Search people or chats" /></div>
        <div class="stories"><div class="story">${avatar(profile.name)}<div>Your story</div></div>${contacts.slice(0,5).map(c=>`<div class="story">${avatar(c.name)}<div>${esc(c.name.split(' ')[0])}</div></div>`).join('')}</div>
        <div class="page-title">Messages</div><div id="chatList">${chatListHtml(list)}</div>`;
      bindChatRows();$('#searchInput').oninput=e=>{$('#chatList').innerHTML=chatListHtml(list.filter(c=>(c.name+' '+c.id).toLowerCase().includes(e.target.value.toLowerCase())));bindChatRows()};
    }
    function chatListHtml(list){return list.length?list.map(c=>`<div class="chat-row" data-id="${esc(c.id)}">${avatar(c.name)}<div class="row-main"><div class="row-name">${esc(c.name)} ${c.online?'<span style="color:var(--green);font-size:9px">●</span>':''}</div><div class="row-preview">${esc(c.last||'Tap to start chatting')}</div></div><div><div class="row-time">${c.lastAt?time(c.lastAt):''}</div>${c.unread?`<div class="badge">${c.unread}</div>`:''}</div></div>`).join(''):`<div class="empty"><div class="big">💬</div><h3>No conversations yet</h3><p>Tap + and add a friend using their universal @ID.</p></div>`}
    function bindChatRows(){document.querySelectorAll('.chat-row').forEach(r=>r.onclick=()=>openChat(r.dataset.id))}
    function openChat(id){activeChat=normalize(id);const c=contact(id);if(c)c.unread=0;save();render()}
    function renderChat(){
      const c=contact(activeChat)||{id:activeChat,name:'@'+activeChat};
      $('#topbar').innerHTML=`<button class="icon-btn" id="backChat">‹</button>${avatar(c.name,'sm')}<div class="grow chat-header"><div class="row-name">${esc(c.name)}</div><div class="sub">${c.online?'Online':'May be offline'} • @${esc(c.id)}</div></div><button class="icon-btn" id="audioCall">☎</button><button class="icon-btn" id="videoCall">▣</button>`;
      $('#content').className='messages';$('#content').innerHTML=`<div class="encryption">🔒 Peer-to-peer encrypted in transit. Both people must be online for new messages.</div>${chatMessages(activeChat).map(messageHtml).join('')}`;
      const wrap=document.createElement('div');wrap.className='composer-wrap';wrap.id='composerWrap';wrap.innerHTML=`<div class="composer"><button class="mini-btn" id="attachBtn">＋</button><button class="mini-btn" id="stickerBtn">☺</button><div class="compose-input"><input id="messageInput" maxlength="2000" placeholder="Message ${esc(c.name)}" /></div><button class="mini-btn" id="voiceBtn">🎙</button><button class="mini-btn send" id="sendBtn">➤</button></div>`;$('#app').appendChild(wrap);
      $('#backChat').onclick=closeChat;$('#audioCall').onclick=()=>startCall(activeChat,'audio');$('#videoCall').onclick=()=>startCall(activeChat,'video');
      $('#attachBtn').onclick=()=>$('#imagePicker').click();$('#stickerBtn').onclick=openStickers;$('#sendBtn').onclick=sendText;$('#messageInput').onkeydown=e=>{if(e.key==='Enter')sendText()};$('#voiceBtn').onclick=toggleRecording;
      $('#content').scrollTop=$('#content').scrollHeight;
    }
    function messageHtml(m){const mine=m.sender===profile.id, cls=mine?'mine':'';let body='';if(m.type==='text')body=esc(m.body);if(m.type==='sticker')return `<div class="msg-line ${cls}"><div class="bubble sticker-msg">${esc(m.body)}<div class="meta">${time(m.at)}</div></div></div>`;if(m.type==='image')body=`<img src="${m.body}" alt="Shared image"/><span>${esc(m.caption||'')}</span>`;if(m.type==='voice')body=`<div class="voice"><button data-audio="${m.id}">▶</button><div class="wave"></div><small>${Math.max(1,m.duration||1)}s</small><audio id="audio-${m.id}" src="${m.body}"></audio></div>`;return `<div class="msg-line ${cls}"><div class="bubble">${body}<div class="meta">${time(m.at)} ${mine?'✓✓':''}</div></div></div>`}
    function closeChat(){document.querySelector('#composerWrap')?.remove();$('#content').className='';activeChat=null;render()}
    function makeMessage(type,body,extra={}){return {id:crypto.randomUUID?crypto.randomUUID():String(now())+Math.random(),type,body,at:now(),sender:profile.id,senderName:profile.name,...extra}}
    function sendText(){const input=$('#messageInput'),body=input.value.trim();if(!body)return;sendMessage(activeChat,makeMessage('text',body));input.value=''}
    function sendMessage(id,m){pushMessage(id,m);sendPacket(id,{kind:'message',message:m});if(activeChat===id)renderChatAfterSend()}
    function renderChatAfterSend(){document.querySelector('#composerWrap')?.remove();render();setTimeout(()=>{$('#content').scrollTop=$('#content').scrollHeight},0)}
    document.addEventListener('click',e=>{const b=e.target.closest('[data-audio]');if(!b)return;const a=$('#audio-'+b.dataset.audio);if(a.paused){document.querySelectorAll('audio').forEach(x=>x.pause());a.play();b.textContent='❚❚';a.onended=()=>b.textContent='▶'}else{a.pause();b.textContent='▶'}});

    function renderCalls(){const rows=calls.length?calls.map(c=>`<div class="call-row">${avatar(c.name)}<div class="row-main"><div class="row-name">${esc(c.name)}</div><div class="row-preview">${c.direction==='incoming'?'↙':'↗'} ${esc(c.type)} call • ${new Date(c.at).toLocaleDateString()}</div></div><button class="icon-btn" data-call="${esc(c.id)}" data-type="${esc(c.type)}">${c.type==='video'?'▣':'☎'}</button></div>`).join(''):`<div class="empty"><div class="big">☎</div><h3>No calls yet</h3><p>Open a conversation and tap the phone or video icon.</p></div>`;$('#content').innerHTML=`<div class="hero-card"><h2>Encrypted live calls</h2><p>Audio and video travel directly between the two connected devices through WebRTC.</p></div><div class="page-title">Recent calls</div>${rows}`;document.querySelectorAll('[data-call]').forEach(b=>b.onclick=()=>startCall(b.dataset.call,b.dataset.type))}
    function renderPeople(){const rows=contacts.length?contacts.map(c=>`<div class="contact-row" data-person="${esc(c.id)}">${avatar(c.name)}<div class="row-main"><div class="row-name">${esc(c.name)}</div><div class="row-preview">@${esc(c.id)} • ${c.online?'online':'offline or unknown'}</div></div><button class="icon-btn">💬</button></div>`).join(''):`<div class="empty"><div class="big">🌍</div><h3>Add anyone by @ID</h3><p>IDs work across countries and do not require a phone number.</p></div>`;$('#content').innerHTML=`<div class="hero-card"><h2>One @UserID. One world.</h2><p>Share this ID so friends can connect while your app is open.</p><div class="id-chip">@${esc(profile.id)}</div></div><div class="page-title">Contacts</div>${rows}`;document.querySelectorAll('[data-person]').forEach(r=>r.onclick=()=>openChat(r.dataset.person))}
    function renderSettings(){
      $('#content').innerHTML=`<div class="hero-card" style="display:flex;gap:15px;align-items:center">${avatar(profile.name,'lg')}<div><h2>${esc(profile.name)}</h2><div class="id-chip" style="margin-top:4px">@${esc(profile.id)}</div></div></div>
        <div class="settings-card"><div class="setting-row"><div class="setting-icon">👤</div><div class="row-main"><div class="row-name">Signed-in account</div><div class="row-preview">@${esc(profile.id)} • ${esc(profile.name)}</div></div></div><div class="setting-row"><div class="setting-icon">💻</div><div class="row-main"><div class="row-name">This device</div><div class="row-preview">${deviceType==='mobile'?'Android phone':'Desktop PC'} endpoint</div></div></div><div class="setting-row"><div class="setting-icon">🔒</div><div class="row-main"><div class="row-name">Peer-to-peer encryption</div><div class="row-preview">WebRTC DTLS/SRTP while connected</div></div></div><div class="setting-row"><div class="setting-icon">🌐</div><div class="row-main"><div class="row-name">Connection</div><div class="row-preview">${online?'Connected to the free PeerJS broker':'Currently disconnected'}</div></div><i class="status-dot ${online?'online':''}"></i></div><div class="setting-row"><div class="setting-icon">⚙</div><div class="row-main"><div class="row-name">App identity</div><div class="row-preview">Clearly labeled Settings Connect</div></div></div></div>
        <div class="warning"><b>Prototype limitation</b><br>Both users must be online. This free version has no offline delivery, push notifications, cloud backup, account recovery, or permanent ID reservation. Do not use it for emergencies or sensitive information.</div>
        <div class="page-title">About</div><div class="feature-grid"><div class="feature"><span class="emoji">⚡</span><b>Direct</b><small>Messages move device to device.</small></div><div class="feature"><span class="emoji">🎥</span><b>Live media</b><small>Audio and video with WebRTC.</small></div><div class="feature"><span class="emoji">🎙</span><b>Voice notes</b><small>Record and send short audio.</small></div><div class="feature"><span class="emoji">🖼</span><b>Attachments</b><small>Share compressed-size images.</small></div></div>
        <button class="btn secondary wide" id="signOut" style="margin-top:20px">Sign out</button><button class="btn danger wide" id="resetApp" style="margin:10px 0 30px">Delete local account and messages</button>`;
      $('#signOut').onclick=signOut;$('#resetApp').onclick=()=>{if(confirm('Delete this account, contacts, and local messages?')){shutdown();localStorage.clear();location.reload()}}
    }

    function openAdd(){
      $('#modal').innerHTML=`<div class="sheet-backdrop"><div class="sheet"><h2>Add people</h2><p>Enter your friend's Settings Connect ID. Their phone or PC app must be open and online.</p><input class="field" id="contactId" autocomplete="off" placeholder="@friend_id" maxlength="29"/><input class="field" id="contactName" autocomplete="off" placeholder="Display name (optional)" maxlength="40"/><div class="sheet-actions"><button class="btn secondary" id="cancelSheet">Cancel</button><button class="btn" id="addContact">Connect</button></div></div></div>`;
      $('#cancelSheet').onclick=closeModal;$('#modal .sheet-backdrop').onclick=e=>{if(e.target.classList.contains('sheet-backdrop'))closeModal()};
      $('#addContact').onclick=()=>{const id=normalize($('#contactId').value),name=$('#contactName').value.trim()||'@'+id;if(!id)return toast('Enter a valid ID');if(id===profile.id)return toast("That's your own ID");ensureContact(id,name);closeModal();connectTo(id,true);tab='people';render()};setTimeout(()=>$('#contactId').focus(),100);
    }
    function openStickers(){$('#modal').innerHTML=`<div class="sheet-backdrop"><div class="sheet"><h2>Stickers</h2><p>Tap one to send it instantly.</p><div class="stickers">${stickers.map(s=>`<button class="sticker" data-sticker="${s}">${s}</button>`).join('')}</div></div></div>`;document.querySelectorAll('[data-sticker]').forEach(b=>b.onclick=()=>{sendMessage(activeChat,makeMessage('sticker',b.dataset.sticker));closeModal()});$('#modal .sheet-backdrop').onclick=e=>{if(e.target.classList.contains('sheet-backdrop'))closeModal()}}
    function closeModal(){$('#modal').innerHTML=''}

    function lockShell(){activeChat=null;document.querySelector('#composerWrap')?.remove();$('#topbar').innerHTML=`<div class="grow"><h1>Settings Connect</h1><div class="sub">Sign in to continue</div></div>`;$('#content').className='';$('#content').innerHTML='';$('#nav').classList.add('hidden');$('#fab').classList.add('hidden')}
    function bytesToB64(bytes){return btoa(String.fromCharCode(...bytes))}
    function b64ToBytes(value){return Uint8Array.from(atob(value),c=>c.charCodeAt(0))}
    async function passwordHash(password,salt){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64ToBytes(salt),iterations:150000,hash:'SHA-256'},key,256);return bytesToB64(new Uint8Array(bits))}
    function showOnboarding(migrate=false){
      lockShell();const existing=migrate&&profile;
      $('#modal').innerHTML=`<div class="onboarding"><div class="onboard-card"><div class="brand-icon">⚙</div><h1>${existing?'Secure your account':'Create account'}</h1><p>${existing?'Create a password for your existing @'+esc(profile.id)+' profile.':'Choose the public ID friends will use to find you on phone or PC.'}</p>${existing?'':`<input class="field" id="profileName" autocomplete="name" placeholder="Your display name" maxlength="40"/><input class="field" id="profileId" autocomplete="username" placeholder="Choose a unique ID" maxlength="28"/><div class="handle-preview" id="idPreview">@your_id</div>`}<input class="field" id="profilePassword" type="password" autocomplete="new-password" placeholder="Password (at least 6 characters)"/><input class="field" id="profilePassword2" type="password" autocomplete="new-password" placeholder="Confirm password"/><button class="btn wide" id="createProfile">${existing?'Save password':'Create account'}</button><p class="small-note">The password unlocks this device. This peer-to-peer prototype does not yet have a cloud account server, recovery email, or permanent global ID reservation.</p></div></div>`;
      if(!existing)$('#profileId').oninput=e=>$('#idPreview').textContent='@'+(normalize(e.target.value)||'your_id');
      $('#createProfile').onclick=async()=>{const name=existing?profile.name:$('#profileName').value.trim(),id=existing?profile.id:normalize($('#profileId').value),password=$('#profilePassword').value,confirmPassword=$('#profilePassword2').value;if(name.length<2)return toast('Enter your name');if(id.length<4)return toast('Use at least 4 letters or numbers');if(password.length<6)return toast('Use a password with at least 6 characters');if(password!==confirmPassword)return toast('The passwords do not match');const button=$('#createProfile');button.disabled=true;button.textContent='Securing…';try{const salt=bytesToB64(crypto.getRandomValues(new Uint8Array(16))),hash=await passwordHash(password,salt);profile={name,id};account={name,id,salt,hash,createdAt:now()};store.set('profile',profile);store.set('account',account);authenticated=true;closeModal();initPeer();render()}catch{button.disabled=false;button.textContent=existing?'Save password':'Create account';toast('Could not secure the account on this device')}}
    }
    function showSignIn(){
      lockShell();$('#modal').innerHTML=`<div class="onboarding"><div class="onboard-card"><div class="brand-icon">⚙</div><h1>Welcome back</h1><p>Sign in to Settings Connect on this ${deviceType==='mobile'?'phone':'PC'}.</p><div class="handle-preview">@${esc(account.id)}</div><input class="field" id="signInPassword" type="password" autocomplete="current-password" placeholder="Password"/><button class="btn wide" id="signInButton">Sign in</button><p class="small-note">Signed-in profile: ${esc(account.name)} • @${esc(account.id)}</p></div></div>`;const submit=async()=>{const button=$('#signInButton');button.disabled=true;button.textContent='Checking…';try{const hash=await passwordHash($('#signInPassword').value,account.salt);if(hash!==account.hash){button.disabled=false;button.textContent='Sign in';return toast('Incorrect password')}profile={name:account.name,id:account.id};store.set('profile',profile);authenticated=true;closeModal();initPeer();render()}catch{button.disabled=false;button.textContent='Sign in';toast('Sign-in failed on this device')}};$('#signInButton').onclick=submit;$('#signInPassword').onkeydown=e=>{if(e.key==='Enter')submit()};setTimeout(()=>$('#signInPassword').focus(),100)
    }
    function signOut(){shutdown();peer=null;connections={};online=false;authenticated=false;showSignIn()}

    function initPeer(){
      if(!profile||typeof Peer==='undefined'){if(typeof Peer==='undefined')toast('Could not load the connection service');return}
      try{peer=new Peer(peerKey(profile.id,deviceType),{host:'0.peerjs.com',port:443,secure:true,debug:1});
        peer.on('open',()=>{online=true;render();toast('Online as @'+profile.id)});
        peer.on('connection',conn=>setupConnection(conn));
        peer.on('call',call=>{incomingCall=call;callPeerId=normalize(call.metadata?.userId||fromPeerKey(call.peer));ensureContact(callPeerId,call.metadata?.name||'@'+callPeerId);showIncoming(call,call.metadata?.type||'audio')});
        peer.on('disconnected',()=>{online=false;render();setTimeout(()=>{try{peer.reconnect()}catch{}},2500)});
        peer.on('error',err=>{if(err.type==='peer-unavailable')return;if(err.type==='unavailable-id'){online=false;toast('This account is already active on another '+deviceType+' device')}else toast('Connection error: '+err.type);render()});
      }catch(e){toast('This device could not start peer-to-peer mode')}
    }
    function liveConnections(id){id=normalize(id);return Object.values(connections).filter(conn=>conn?.open&&normalize(fromPeerKey(conn.peer))===id)}
    function connectTo(id,notify=false){id=normalize(id);if(!peer||!online){if(notify)toast('You are offline');return []}const live=liveConnections(id),created=[];for(const type of ['mobile','desktop']){const target=peerKey(id,type),existing=connections[target];if(target===peer.id||existing?.open||existing&&!existing.closed)continue;const conn=peer.connect(target,{serialization:'json',metadata:{userId:profile.id,name:profile.name,deviceType}});connections[target]=conn;setupConnection(conn,notify);created.push(conn)}if(notify&&live.length)toast('Connected to @'+id);if(notify&&!live.length)setTimeout(()=>{if(!liveConnections(id).length)toast('@'+id+' is not online on phone or PC')},4500);return created}
    function setupConnection(conn,notify=false){const id=normalize(fromPeerKey(conn.peer)),outgoing=normalize(conn.metadata?.userId)===profile.id,remoteName=outgoing?(contact(id)?.name||'@'+id):(conn.metadata?.name||'@'+id);connections[conn.peer]=conn;ensureContact(id,remoteName);conn.on('open',()=>{const c=contact(id);if(c)c.online=true;save();conn.send({kind:'hello',userId:profile.id,name:profile.name,deviceType});if(notify&&liveConnections(id).length===1)toast('Connected to @'+id);render()});conn.on('data',data=>handlePacket(id,data));conn.on('close',()=>{if(connections[conn.peer]===conn)delete connections[conn.peer];const c=contact(id);if(c)c.online=liveConnections(id).length>0;save();render()});conn.on('error',()=>{if(connections[conn.peer]===conn)delete connections[conn.peer]})}
    function sendPacket(id,packet){id=normalize(id);const live=liveConnections(id);live.forEach(conn=>{try{conn.send(packet)}catch{}});const attempts=connectTo(id);attempts.forEach(conn=>conn.on('open',()=>{try{conn.send(packet)}catch{}}))}
    function findOnlinePeer(id){id=normalize(id);const live=liveConnections(id);if(live.length)return Promise.resolve(live[0].peer);connectTo(id);return new Promise((resolve,reject)=>{const timer=setInterval(()=>{const found=liveConnections(id);if(found.length){clearInterval(timer);clearTimeout(timeout);resolve(found[0].peer)}},120);const timeout=setTimeout(()=>{clearInterval(timer);reject(new Error('offline'))},5000)})}
    function handlePacket(id,p){if(!p||typeof p!=='object')return;if(p.kind==='hello'){ensureContact(id,p.name);const c=contact(id);if(c)c.online=true;save();render();return}if(p.kind==='message'&&p.message){const m=p.message;m.sender=id;m.senderName=contact(id)?.name||p.message.senderName||'@'+id;pushMessage(id,m);if(activeChat===id)renderChatAfterSend();else render();toast('New message from '+m.senderName)}}

    async function toggleRecording(){if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[];mediaRecorder=new MediaRecorder(stream);recordStarted=now();mediaRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};mediaRecorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const duration=Math.round((now()-recordStarted)/1000);const blob=new Blob(chunks,{type:mediaRecorder.mimeType||'audio/webm'});if(blob.size>1800000)return toast('Voice note is too large');const reader=new FileReader();reader.onload=()=>sendMessage(activeChat,makeMessage('voice',reader.result,{duration}));reader.readAsDataURL(blob);mediaRecorder=null};mediaRecorder.start();$('#voiceBtn').classList.add('recording');$('#voiceBtn').textContent='■';toast('Recording — tap again to send')}catch(e){toast('Microphone permission is required')}}
    $('#imagePicker').onchange=e=>{const f=e.target.files?.[0];e.target.value='';if(!f||!activeChat)return;if(f.size>2000000)return toast('Choose an image smaller than 2 MB');const reader=new FileReader();reader.onload=()=>sendMessage(activeChat,makeMessage('image',reader.result));reader.readAsDataURL(f)};

    async function startCall(id,type){id=normalize(id);if(!peer||!online)return toast('You must be online to call');try{const targetPeer=await findOnlinePeer(id);callType=type;callPeerId=id;callDirection='outgoing';callLogged=false;localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:type==='video'?{facingMode:'user'}:false});showCall(type,id,'Calling…');currentCall=peer.call(targetPeer,localStream,{metadata:{userId:profile.id,name:profile.name,type,deviceType}});attachCall(currentCall,id,type,'outgoing')}catch(e){endCall(false);toast(e.message==='offline'?'That person is not online on phone or PC':'Camera or microphone permission is required')}}
    function showIncoming(call,type){const id=callPeerId,c=contact(id)||{name:'@'+id};$('#callRoot').innerHTML=`<div class="incoming"><div class="incoming-card">${avatar(c.name,'lg')}<h2>${esc(c.name)}</h2><p>Incoming ${esc(type)} call • @${esc(id)}</p><div class="incoming-actions"><button class="round-action decline" id="declineCall">✕</button><button class="round-action accept" id="acceptCall">☎</button></div></div></div>`;$('#declineCall').onclick=()=>{call.close();incomingCall=null;$('#callRoot').innerHTML='';logCall(id,type,'incoming')};$('#acceptCall').onclick=()=>acceptCall(call,id,type)}
    async function acceptCall(call,id,type){try{callType=type;callPeerId=id;callDirection='incoming';callLogged=false;localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:type==='video'?{facingMode:'user'}:false});call.answer(localStream);currentCall=call;incomingCall=null;showCall(type,id,'Connecting…');attachCall(call,id,type,'incoming')}catch(e){call.close();$('#callRoot').innerHTML='';toast('Camera or microphone permission is required')}}
    function attachCall(call,id,type,direction){callDirection=direction;call.on('stream',stream=>{remoteStream=stream;const rv=$('#remoteVideo');if(rv){rv.srcObject=stream;rv.play().catch(()=>{})}const st=$('#callState');if(st)st.textContent='Connected • encrypted';const st2=$('#callState2');if(st2)st2.textContent='Connected • encrypted'});call.on('close',()=>{logCurrentCall();endCall(false)});call.on('error',()=>{logCurrentCall();endCall(false);toast('The call could not connect')})}
    function showCall(type,id,status){const c=contact(id)||{name:'@'+id};$('#callRoot').innerHTML=`<div class="call-overlay">${type==='video'?'<video id="remoteVideo" class="remote-video" autoplay playsinline></video>':`<div class="call-audio-bg">${avatar(c.name,'lg')}<h2>${esc(c.name)}</h2><p id="callState">${esc(status)}</p></div>`}<div class="call-status"><b>${esc(c.name)}</b><small id="callState2">${esc(status)}</small></div>${type==='video'?'<video id="localVideo" class="local-video" autoplay muted playsinline></video>':''}<div class="call-controls"><button class="call-control" id="muteCall">🎙</button>${type==='video'?'<button class="call-control" id="videoToggle">▣</button><button class="call-control" id="flipCamera">↻</button>':''}<button class="call-control hang" id="hangCall">☎</button></div></div>`;if(type==='video'&&localStream){$('#localVideo').srcObject=localStream;$('#localVideo').play().catch(()=>{})}$('#muteCall').onclick=toggleMute;if($('#videoToggle'))$('#videoToggle').onclick=toggleVideo;if($('#flipCamera'))$('#flipCamera').onclick=flipCamera;$('#hangCall').onclick=()=>endCall(true)}
    function toggleMute(){const t=localStream?.getAudioTracks()[0];if(!t)return;t.enabled=!t.enabled;$('#muteCall').classList.toggle('off',!t.enabled)}
    function toggleVideo(){const t=localStream?.getVideoTracks()[0];if(!t)return;t.enabled=!t.enabled;$('#videoToggle').classList.toggle('off',!t.enabled)}
    async function flipCamera(){const t=localStream?.getVideoTracks()[0];if(!t)return;const current=t.getSettings().facingMode||'user';try{await t.applyConstraints({facingMode:current==='user'?{exact:'environment'}:'user'})}catch{toast('Camera switching is not supported on this device')}}
    function logCall(id,type,direction){const c=contact(id);calls.unshift({id,name:c?.name||'@'+id,type,direction,at:now()});calls=calls.slice(0,40);save()}
    function logCurrentCall(){if(!callLogged&&callPeerId){callLogged=true;logCall(callPeerId,callType,callDirection)}}
    function endCall(close=true){if(currentCall)logCurrentCall();if(close&&currentCall){try{currentCall.close()}catch{}}localStream?.getTracks().forEach(t=>t.stop());remoteStream?.getTracks().forEach(t=>t.stop());localStream=remoteStream=currentCall=null;$('#callRoot').innerHTML='';render()}

    function back(){if($('#modal').innerHTML){closeModal();return true}if(incomingCall){try{incomingCall.close()}catch{}incomingCall=null;$('#callRoot').innerHTML='';return true}if(currentCall){endCall(true);return true}if(activeChat){closeChat();return true}return false}
    function shutdown(){try{mediaRecorder?.stop()}catch{}try{currentCall?.close()}catch{}localStream?.getTracks().forEach(t=>t.stop());try{peer?.destroy()}catch{}}
    window.SettingsConnect={back,shutdown};
    if(account){profile=profile||{name:account.name,id:account.id};showSignIn()}else if(profile)showOnboarding(true);else showOnboarding(false)
  })();
  </script>
</body>
